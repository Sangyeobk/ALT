  axis_unknown_label: 초록에 없음    # [사용자 2026-10-16] 주제별 축에서 제목·초록(·본문 정리)에 근거가 없는 논문 — 추측 배정 안 함
  structure_groups:               # [제안] 구조물 표시 묶음. 위에서부터 단어가 처음 맞는 묶음으로 넣는다
