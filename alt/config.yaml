  placeholder_phrases: [선택한 접근법, 선택한 주제, 이 분야를 정리, 주제를 한 장, 에서 보이는 것]
                                  # [사용자 2026-10-16] 실제 이름 대신 쓰는 자리표시 말 — check_terms.py가 산출물에서 찾으면 실패
  cite_shown: 3                  # [사용자] 보고서·발표 본문에 보이는 인용 키 수 (나머지는 '외 N편')
  table_cite_shown: 2            # [사용자 2026-10-27] 보고서 표·강조 상자 안 인용은 쪽 번호 없이 키 최대 2개
