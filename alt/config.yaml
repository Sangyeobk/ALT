  map_min_relevance: 3            # [사용자] 문헌지도에 넣을 관련성 하한 (선정 외 후보도 회색으로 표시)
  gap_matrix_min_relevance: 3     # [제안] 공백 행렬은 관련성 3점 이상 후보 전체로 센다 (분야 전체 분포를 보기 위해)
  data_source_labels: [수치해석, 모형시험, 현장계측]   # [제안] 논문별 학습·검증 자료 분류 (synthesis method_comparison[].data_source, 초록 판독). 없으면 '미기재'
  approach_labels:                # 채점 결과의 접근법 태그 → 표시 이름
    data-driven: 데이터 기반
