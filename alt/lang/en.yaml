# 결과물 고정 문구 영어 대응표 (사용자 결정 2026-10-29) — 키: 코드 속 한국어 원문 그대로, 값: 영어.
# {이름}은 자리표시 — 원문과 같은 이름을 그대로 둔다. 단수·복수가 다르면 {one: ..., other: ...} (n이 1이면 one).
# 다른 언어를 더하려면 이 파일을 <언어>.yaml로 복사해 값만 바꾸고 common.LANGUAGES에 더한다.

# ---- common.py ----
"조사 주제: {topic} · 접근법: {approach} · 기간 {years}": "Survey topic: {topic} · Approach: {approach} · Period {years}"
" (핵심논문 수록 {held})": " (core papers published {held})"
"입력 원문": "Original request"
"해석 확인": "Clarification"
"상위 조사": "Parent survey"
