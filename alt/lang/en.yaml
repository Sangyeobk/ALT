"범위 결정": "Scope decision"
"세부 조사로 분리": "Split into a sub-survey"
" → 결과 폴더 {run}": " → result folder {run}"
"{topic} — 연구 동향 ({years})": "{topic} — Research Trends ({years})"
"{topic} — {approach} 연구 동향 ({years})": "{topic} — Research Trends ({approach}, {years})"
" 외 {n}편": {one: " and {n} more paper", other: " and {n} more papers"}
"전체 {total}편 중 ": "Of {total} papers: "
