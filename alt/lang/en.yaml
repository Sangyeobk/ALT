"검토 수준: {counted} (전문 모드 — 받아 둔 본문을 읽고 정리)": "Review level: {counted} (full-text mode — summarized from the downloaded full texts)"
"검토 수준: {counted} (초록 모드 — 수치·검증 내용은 원문 확인 필요)": "Review level: {counted} (abstract mode — check numbers and validation details in the original papers)"
"전문": "full text"
"초록": "abstract"
"제목만": "title only"
"개인 설정": "personal settings"
"이 조사 맞춤": "this survey"
"이름: PRISMA(Preferred Reporting Items for Systematic Reviews and Meta-Analyses) 흐름도": "Name: PRISMA (Preferred Reporting Items for Systematic Reviews and Meta-Analyses) flow diagram"
"원래 쓰는 곳: 의학·보건학·사회과학 등의 체계적 문헌고찰(Systematic Review)과 메타분석(Meta-Analysis)": "Original use: systematic reviews and meta-analyses in medicine, public health and the social sciences"
"하는 일: 논문을 어떻게 검색하고 최종 선정했는지 그 과정을 투명하게 보여 주는 표준 순서도": "Purpose: a standard flow chart that shows transparently how papers were searched and finally selected"
? "이 조사에서는: 선별 과정을 PRISMA 흐름도 양식으로 표시함 — 체계적 문헌고찰의 나머지 절차(사전 등록, 연구별 비뚤림 위험 평가, 메타분석)는 하지 않은 연구 동향 조사임"
: "In this survey: the selection process is shown in the PRISMA flow-diagram format — this is a research-trend survey; the other steps of a systematic review (pre-registration, per-study risk-of-bias assessment, meta-analysis) were not carried out"

